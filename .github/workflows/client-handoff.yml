name: Client Handoff - Windows and Android
on:
  push:
    branches: [client-handoff-windows-android]
  workflow_dispatch:
    inputs:
      run_live_acceptance:
        description: "Run authenticated backend checks; no email send or paid video submission"
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  core-api-security:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.18.0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pnpm install --no-frozen-lockfile
      - run: node --check scripts/release-acceptance.mjs
      - run: pnpm --filter @irfan/worker test
      - run: pnpm --filter @irfan/desktop build
      - run: node --test apps/desktop/tests/whatsapp.test.cjs
      - run: node --check services/worker/src/devices.js
      - run: npx --yes wrangler@4 deploy --dry-run --config services/worker/wrangler.toml
        env: {CLOUDFLARE_ACCOUNT_ID: 54be6cc8b4c78a417dc4eecb3cd4fc56}
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.18.0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @irfan/ui build
      - name: Native PowerShell syntax check
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path apps/desktop/scripts/tools.ps1),[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Prepare optional Windows Authenticode certificate
        id: windows_signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "::warning::No Windows code-signing certificate configured; artifact will be an unsigned test installer."
            exit 0
          }
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          $cert = Join-Path $env:RUNNER_TEMP 'jarvis-studio-authenticode.pfx'
          [System.IO.File]::WriteAllBytes($cert, $bytes)
          if ((Get-Item $cert).Length -lt 256) { throw 'Windows signing certificate is too small to be valid.' }
          "WIN_CSC_LINK=$cert" >> $env:GITHUB_ENV
          "WIN_CSC_KEY_PASSWORD=$env:WINDOWS_CERTIFICATE_PASSWORD" >> $env:GITHUB_ENV
          "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - run: pnpm --filter @irfan/desktop dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: pnpm --filter @irfan/desktop verify:windows
      - run: node --test apps/desktop/tests/whatsapp.test.cjs
      - name: Windows installed executable launch smoke test
        shell: pwsh
        run: |
          $exe = Get-ChildItem "apps/desktop/release/win-unpacked" -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) { throw 'No packaged Windows executable' }
          $p=Start-Process -FilePath $exe.FullName -ArgumentList '--disable-gpu' -PassThru
          Start-Sleep -Seconds 9
          if ($p.HasExited) { throw "Jarvis exited unexpectedly during Windows launch: $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
      - name: Verify Windows installer signature
        if: ${{ steps.windows_signing.outputs.enabled == 'true' }}
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'apps/desktop/release' -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'No Windows installer found.' }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne 'Valid') { throw "Installer signature is not valid: $($signature.Status)" }
          Write-Host "Windows Authenticode signature is valid."
      - name: Upload unsigned Windows test installer
        if: ${{ steps.windows_signing.outputs.enabled != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: irfan-client-windows-unsigned-nsis
          path: apps/desktop/release/*.exe
          if-no-files-found: error
      - name: Upload signed Windows release installer
        if: ${{ steps.windows_signing.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: irfan-client-windows-signed-nsis
          path: apps/desktop/release/*.exe
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: pnpm/action-setup@v4
        with: {version: 10.18.0}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @irfan/ui build
      - name: Copy exactly the bundled desktop Next.js interface
        run: |
          test -f apps/ui/out/index.html
          mkdir -p apps/android/app/src/main/assets
          cp -a apps/ui/out/. apps/android/app/src/main/assets/
      - run: gradle -p apps/android :app:assembleDebug --no-daemon --stacktrace
      - name: Verify installable Android APK includes JavaScript UI
        run: |
          APK=$(find apps/android/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -1)
          test -n "$APK"
          unzip -Z -1 "$APK" > /tmp/irfan-apk-entries.txt
          echo "APK HTML, JavaScript, and compiled code entries (first 60):"
          grep -E '(^assets/|^classes)' /tmp/irfan-apk-entries.txt | head -n 60 || true
          echo "APK files: $(wc -l < /tmp/irfan-apk-entries.txt)"
          grep -Fqx 'assets/index.html' /tmp/irfan-apk-entries.txt
          grep -q '^assets/_next/' /tmp/irfan-apk-entries.txt
          grep -Eq '^classes([0-9]+)?[.]dex$' /tmp/irfan-apk-entries.txt
      - uses: actions/upload-artifact@v4
        with:
          name: irfan-client-android-sideload-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Prepare optional owner-controlled Android release keystore
        id: android_signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Android release-signing secrets missing; only the debug APK is available."
            exit 0
          fi
          keyfile="$RUNNER_TEMP/jarvis-owner-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keyfile"
          test -s "$keyfile"
          keytool -list -keystore "$keyfile" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_FILE=$keyfile" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - name: Assemble signed Android release APK
        if: ${{ steps.android_signing.outputs.enabled == 'true' }}
        run: gradle -p apps/android :app:assembleRelease --no-daemon --stacktrace
      - name: Verify signed Android release APK
        if: ${{ steps.android_signing.outputs.enabled == 'true' }}
        shell: bash
        run: |
          set -eu
          apk="$(find apps/android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)"
          test -n "$apk"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose "$apk"
      - name: Upload signed Android release APK
        if: ${{ steps.android_signing.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: irfan-client-android-release-signed
          path: apps/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
  android-emulator:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/download-artifact@v4
        with:
          name: irfan-client-android-sideload-debug-apk
          path: android-apk
      - name: Boot Android 13, install actual distributed APK and launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -eu
            adb wait-for-device
            adb install -r android-apk/app-debug.apk
            adb shell am force-stop com.irfan.companion || true
            adb shell am start -W -n com.irfan.companion/.MainActivity
            # Require an actual running application process; retry briefly for slow emulator startups.
            running=0
            for attempt in $(seq 1 15); do
              if adb shell pidof com.irfan.companion 2>/dev/null | tr -d '\\r' | grep -Eq '[0-9]+'; then
                running=1
                break
              fi
              sleep 2
            done
            if [ "$running" -ne 1 ]; then
              echo "Jarvis companion process did not stay running."
              adb logcat -d -t 1000 || true
              exit 1
            fi
            if adb logcat -d -t 1000 | grep -F 'Process: com.irfan.companion'; then exit 1; fi
            # Screenshot is diagnostic only. An intermittent emulator/ADB disconnect must not
            # invalidate a successful install + process + no-crash smoke test.
            if adb shell screencap -p /sdcard/irfan-home.png && adb pull /sdcard/irfan-home.png android-emulator-home.png; then
              echo "Captured emulator screenshot."
            else
              echo "Screenshot unavailable (emulator transport issue); app launch checks passed."
            fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: irfan-android-emulator-screenshot
          path: android-emulator-home.png
          if-no-files-found: ignore

  live-acceptance:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_acceptance }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run authenticated, non-destructive release smoke checks
        env:
          JARVIS_BASE_URL: ${{ vars.JARVIS_BASE_URL }}
          JARVIS_APP_TOKEN: ${{ secrets.JARVIS_APP_TOKEN }}
        run: node scripts/release-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jarvis-live-acceptance-report
          path: release-acceptance-report.md
          if-no-files-found: ignore
