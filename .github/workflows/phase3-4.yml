name: Phase 3+4 Email and Video checks
on:
  push:
    branches: [phase-3-4-email-video]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @irfan/worker test
      - run: node --check services/worker/src/email.js
      - run: node --check services/worker/src/video.js
      - run: node --check services/worker/src/index.js
      - run: pnpm exec wrangler deploy --dry-run --config services/worker/wrangler.toml
        env:
          CLOUDFLARE_ACCOUNT_ID: 54be6cc8b4c78a417dc4eecb3cd4fc56
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @irfan/ui build
      - run: pnpm --filter @irfan/desktop dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: irfans-studio-phase3-4-windows
          path: apps/desktop/release/*.exe
          if-no-files-found: error
