name: Phases 1-4 Completion Gate
on:
  push:
    branches: [phase-1-4-completion]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @irfan/worker test
      - run: node --check services/worker/src/index.js
      - run: node --check services/worker/src/email.js
      - run: node --check services/worker/src/video.js
      - run: npx --yes wrangler@4 deploy --dry-run --config services/worker/wrangler.toml
        env:
          CLOUDFLARE_ACCOUNT_ID: 54be6cc8b4c78a417dc4eecb3cd4fc56
  ffmpeg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @irfan/desktop build
      - run: node --test apps/desktop/tests/video-smoke.test.cjs
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @irfan/ui build
      - name: Validate Windows PowerShell script syntax
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path apps/desktop/scripts/tools.ps1),[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Windows local tool smoke test
        shell: pwsh
        run: |
          $payload = '{"name":"list_running_apps","args":{}}'
          $output = $payload | powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File apps/desktop/scripts/tools.ps1
          if ($LASTEXITCODE -ne 0) { throw $output }
          $parsed = $output | ConvertFrom-Json
          if ($null -eq $parsed.apps) { throw 'No apps field' }
      - run: pnpm --filter @irfan/desktop dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: irfan-phase1-4-candidate-installer
          path: apps/desktop/release/*.exe
          if-no-files-found: error
