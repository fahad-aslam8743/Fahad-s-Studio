name: Phase 2 Windows checks
on:
  push:
    branches: [phase-2-windows-tools]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - name: PowerShell helper smoke test
        shell: pwsh
        run: |
          $payload = '{"name":"list_running_apps","args":{}}'
          $output = $payload | powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File apps/desktop/scripts/tools.ps1
          if ($LASTEXITCODE -ne 0) { throw $output }
          $parsed = $output | ConvertFrom-Json
          if ($null -eq $parsed.apps) { throw 'Missing apps result' }
      - run: pnpm --filter @irfan/ui build
      - run: pnpm --filter @irfan/desktop dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: irfans-studio-phase2-windows
          path: apps/desktop/release/*.exe
          if-no-files-found: error
