name: Phase 1 checks
on:
  push:
    branches: [phase-1-foundation, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @irfan/ui build
      - run: pnpm --filter @irfan/desktop dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: irfans-studio-windows-installer
          path: apps/desktop/release/*.exe
          if-no-files-found: error
