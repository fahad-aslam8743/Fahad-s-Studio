name: Phase 5-6 Android and Desktop
on:
  push:
    branches: [phase-5-6-android-polish]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.18.0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @irfan/worker test
      - run: node --check services/worker/src/devices.js
      - run: npx --yes wrangler@4 deploy --dry-run --config services/worker/wrangler.toml
        env: {CLOUDFLARE_ACCOUNT_ID: 54be6cc8b4c78a417dc4eecb3cd4fc56}
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: pnpm/action-setup@v4
        with: {version: 10.18.0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @irfan/ui build
      - name: Bundle the EXACT exported Next.js UI inside Android assets
        run: |
          test -f apps/ui/out/index.html
          mkdir -p apps/android/app/src/main/assets
          cp -a apps/ui/out/. apps/android/app/src/main/assets/
      - run: gradle -p apps/android :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: irfan-companion-android-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: pnpm/action-setup@v4
        with: {version: 10.18.0}
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @irfan/ui build
      - run: pnpm --filter @irfan/desktop dist:win
        env: {CSC_IDENTITY_AUTO_DISCOVERY: 'false'}
      - uses: actions/upload-artifact@v4
        with:
          name: irfan-studio-windows-phase6-candidate
          path: apps/desktop/release/*.exe
          if-no-files-found: error
