name: Explicit Signed Client Release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  windows:
    if: ${{ vars.SIGNED_RELEASE_ENABLED == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.18.0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Refuse unsigned release
        shell: pwsh
        env:
          CERT: ${{ secrets.WIN_CSC_LINK }}
          PASS: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if (-not $env:CERT -or -not $env:PASS) { throw 'Windows signing secrets missing' }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @irfan/ui build
      - run: pnpm --filter @irfan/desktop dist:win:release
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
  android:
    if: ${{ vars.SIGNED_RELEASE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: pnpm/action-setup@v4
        with: {version: 10.18.0}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Require Android signing materials
        env:
          KEY_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEY_B64" && test -n "$ALIAS" && test -n "$STORE_PASS" && test -n "$KEY_PASS"
          echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/irfan-release.jks"
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @irfan/ui build
      - run: mkdir -p apps/android/app/src/main/assets && cp -a apps/ui/out/. apps/android/app/src/main/assets/
      - run: gradle -p apps/android :app:assembleRelease --no-daemon
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/irfan-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: softprops/action-gh-release@v2
        with:
          files: apps/android/app/build/outputs/apk/release/*.apk
