name: Phase 6 WhatsApp Web candidate
on:
  push:
    branches: [phase-6-whatsapp-web]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.18.0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @irfan/desktop build
      - run: node --test apps/desktop/tests/whatsapp.test.cjs
      - run: pnpm --filter @irfan/worker test
  windows:
    runs-on: windows-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10.18.0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @irfan/desktop build
      - run: node --test apps/desktop/tests/whatsapp.test.cjs
      - run: pnpm --filter @irfan/ui build
      - run: pnpm --filter @irfan/desktop dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: irfan-windows-whatsapp-unsigned-candidate
          path: apps/desktop/release/*.exe
          if-no-files-found: error
